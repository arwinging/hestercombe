/* ---------- grouping ---------- */
function groupedHtml(tab,groupBy,items,cfg,renderItem,subBy){
  S.keys[tab]=[];
  var g=cfg[groupBy];
  if(!g)return '<div class="list">'+items.map(renderItem).join('')+'</div>';
  var map={},keys=[],has=function(o,k){return Object.prototype.hasOwnProperty.call(o,k)};
  items.forEach(function(it){var k=g.key(it);if(!has(map,k)){map[k]=[];keys.push(k)}map[k].push(it)});
  keys.sort(g.cmp);
  return keys.map(function(k){
    var ck=tab+':'+groupBy+':'+k;S.keys[tab].push(ck);
    var open=!S.coll[ck],inner='';
    if(open){
      var useSub=subBy&&subBy!=='none'&&subBy!==groupBy&&cfg[subBy]&&!(groupBy==='plant'&&(subBy==='place'||subBy==='genus'));
      if(g.block&&!useSub)inner=g.block(map[k],k);
      else if(useSub){
        var sg=cfg[subBy],sm={},sk=[];
        map[k].forEach(function(it){var kk=sg.key(it);if(!has(sm,kk)){sm[kk]=[];sk.push(kk)}sm[kk].push(it)});
        sk.sort(sg.cmp);
        inner=sk.map(function(kk){var sck=ck+':sub:'+kk;S.keys[tab].push(sck);var so=!S.coll[sck];return '<button class="sh gh" data-g="'+esc(sck)+'" aria-expanded="'+so+'"><span class="gl"><span class="chev"></span>'+sg.label(kk)+'</span><span class="cnt">'+sm[kk].length+'</span></button>'+(so?'<div class="list subl">'+sm[kk].map(g.subRender||renderItem).join('')+'</div>':'')}).join('');
      }else inner='<div class="list">'+map[k].map(renderItem).join('')+'</div>';
    }
    return '<div class="grp g-'+groupBy+(g.cls?' '+g.cls:'')+'"><div class="hdr gh" role="button" tabindex="0" data-g="'+esc(ck)+'" aria-expanded="'+open+'"><span class="gl"><span class="chev"></span>'+g.label(k)+'</span>'+(g.badge?g.badge(k):'')+'<span class="cnt">'+map[k].length+'</span></div>'+inner+'</div>';
  }).join('');
}

function exportFile(kind){

  else{rows=[['Garden LOG date','Place','Plan No.','BOTANICAL NAME','Garden LOG event','Garden LOG event details','Man hrs spent']].concat(sortLogs(Object.keys(S.logs)).map(function(i){var l=S.logs[i];return [l.date,l.place,l.no,l.name,l.event,l.details,l.hours]}));name='garden-logger.csv'}
  if(!downloads){toast('Export is not available in this view');return}
  downloads.save({filename:name,data:csv(rows)}).then(function(){toast('Exported')}).catch(function(e){if(!e||e.code!=='cancelled')toast('Export did not complete')});
}
function exportXlsx(btn){

  var plants=[['Place','Number','BOTANICAL NAME','Gardening NOTES','COMMON NAME','PLANT SPECIFIED BY JEKYLL','NOTE','Last edited by','Last edited']].concat(PLANTS.map(function(p){return [p.place,p.no,p.name,p.notes,p.common,p.jekyll,p.tag].concat(eb(S.edits[p.id]))}));
  var plan=[['Place','Plan No.','BOTANICAL NAME','Assigned Month','Garden Task','Season','Garden Task details','Repeats','First year','Done in (year: date)','Last edited by','Last edited']].concat(Object.keys(S.tasks).map(function(i){var t=S.tasks[i],d=t.doneBy||{};return [t.place,t.no,t.name,t.month?MON[t.month]:'',t.task,t.season,t.details,repLabel(t),t.startYear||'',Object.keys(d).sort().map(function(y){return y+': '+(d[y]&&d[y].date||'done')}).join('; ')].concat(eb(t))}));
  var logger=[['Garden LOG date','Place','Plan No.','BOTANICAL NAME','Garden LOG event','Garden LOG event details','Man hrs spent','Last edited by','Last edited']].concat(T.map(function(i){var l=S.logs[i];return [l.date,l.place,l.no,l.name,l.event,l.details,l.hours].concat(eb(l))}));
  var by={},ord=[];T.slice().sort(function(a,b){return (S.logs[a].date||'')<(S.logs[b].date||'')?-1:1}).forEach(function(i){var l=S.logs[i],k=[l.place,l.no,l.name].join('|');if(!by[k]){by[k]=[l.place,l.no,l.name,[]];ord.push(k)}by[k][3].push((l.date||'')+' - '+(l.event||'')+(l.details?'| '+l.details:''))});

  btn.disabled=true;var old=btn.textContent;btn.textContent='Preparing…';
  db.call({action:'xlsx',tabs:[{name:'Master Plant plan',rows:plants,split:3},{name:'Garden Planner',rows:plan,split:3},{name:'Garden logger',rows:logger,split:4},{name:'Log history',rows:hist,split:3}]}).then(function(j){

    return downloads.save({filename:'Hestercombe-garden-plants.xlsx',b64:j.b64});
  }).then(function(){toast('Excel file downloaded')}).catch(function(e){toast('Excel export failed: '+(e&&e.message||'try again'))}).then(function(){btn.disabled=false;btn.textContent=old});

  foldSec('m-help','How it works','',
  '<p><b>Plants</b>: search and browse every plant. Open one to see its details, planned tasks and log history.</p>'+
  '<p><b>Plan</b>: tasks to do, by year. Tick the circle when a task is done for the year shown at the top.</p>'+
  '<p><b>Log</b>: a record of work done, with date, task and hours.</p>'+
  '<p><b>Group tasks</b> <span class="gname latin">FUCHSIA<span class="gall">all</span></span>: one task for many plants: a whole genus (ROSA) or one kind everywhere (FUCHSIA \'Riccartonii\').</p>'+
  '<details><summary>More detail</summary>'+
  '<h4>Plants</h4>'+
  '<p><b>Search</b>: type the start of any word in the botanical, common or Jekyll name, or a place. Tap × to clear.</p>'+
  '<p><b>Place and task filters</b>: tap the box to tick one or several places (or tasks). The box then shows a colour strip, the name in bold and a ✕ to clear it. The grey bar under the toolbar says how many filters are on and has “Clear all”. Places in an Area are folded together: tap the Area name to tick all its places, tap ▸ to open it. You can set an Area for each place in More > Edit places.</p>'+
  '<p><b>List</b>: group by place or genus, then by a second level. “in N more” means the same plant also grows in N other places. Everywhere in the app, tap a place tag (or the label with ›) to open the place page; the small pin next to it opens the map. With one place selected, its label shows at the top of the list. “Task tags” shows or hides each plant’s open tasks and log count.</p>'+
  '<p><b>Still there?</b>: tap the small green “✓ Still there?” button to start a check, then tap ✓ (here), ✗ (missing) or ? (unsure) next to each plant’s name. One tap saves it with today’s date (only the latest check is kept; tap the same square again to clear it). In the list, a small ✓ ✗ or ? sits to the left of the plant number; the date and note are in the plant page. Missing plants are dimmed. Tap Done to finish.</p>'+
  '<p><b>Maps</b>: tap a pin to open the map in its own page, so you can switch between the map and the app. Pinch or use − / + to zoom. The first time a map is opened it is downloaded and kept on the phone, so it also works without signal (↻ Update fetches a fresh copy). If a map cannot load, the page says why. “Open in Drive” opens the original file. The Drive link of each place is set in More > Edit places.</p>'+

  '<p><b>Plant page</b>: details, still-there check, gardening notes, My note, planned tasks and log history. Tap a heading with an arrow to fold it. “✎ Edit” next to the name changes the plant. Notes show as plain text: tap the text to type, tap anywhere else to finish, and it saves by itself. Tapping ✓ ✗ or ? opens the still-there note box straight away. After a change, the small undo and redo arrows next to the heading step back or forward (they work while the page is open). “Original note and Jekyll” is folded in the form.</p>'+
  '<p><b>New plant</b>: type to find the place (only existing places; add new ones in More > Edit places). Plants found outside the original plan are numbered N plus a number, for example N27; if one replaced an existing position, use that number with an N, for example N5.</p>'+
  '<h4>Plan</h4>'+
  '<p><b>Year bar</b>: ‹ › change year, tap the year for all years. Hold the year to type any year in place (type four digits and press Enter). Each year is ticked off separately: tick the circle when a task is done for the year shown.</p>'+
  '<p><b>Attention</b> tasks and tasks with no month (“Not scheduled”) are pinned in their own boxes at the top, as reminders. Tap a box heading to fold it; the app remembers. Attention can be saved without a plant. In the task lists, Attention is always first.</p>'+
  '<p><b>Filters</b>: Open / Done / All next to the search; place and task boxes below (tick several); then grouping. The top row has Overdue, a month button with ‹ › (tap it to show only that month, ‹ › to move to the previous or next month), Attention and Not sched. (tap these two to open or close their boxes). Overdue and the month button switch the list to Open so the number on the button is the number of tasks shown; tap again to go back. In the place and task lists, “Select all” / “Deselect all” ticks everything that matches your search. With grouping by month, “Jan → Dec ⇅” flips the order. Collapse all, on the right, also folds the Attention and Not scheduled boxes.</p>'+
  '<p><b>Adding tasks</b>: type a plant name or a place in the one search box and pick from the list; it becomes one line (tap ✕ to clear). Picking a place alone makes a whole-place task. “＋ Add another plant” adds another line the same way (✕ or Remove takes it away). “＋ Or link by plant group” shows the group choices: “All FUCHSIA (8) as one task”, “All FUCHSIA \'Riccartonii\' (3) as one task” or “One task for each plant”. Under the ticked choice, “Only in [place]” limits it to one place, and the box lists the plants it covers (tap an underlined name to open that plant). With “One task for each plant”, untick any plant you don’t want, or use Select all. “＋ Add another task” sits below the note. Together they save every combination, for example 2 plants × 2 tasks = 4 tasks. Repeats default to “Once only”; pick “Every year”, every few years or chosen years. “First year it applies” starts at the current year.</p>'+
  '<p><b>Group tasks</b> <span class="gname latin">ROSA<span class="gall">all</span></span>: “All ROSA” covers the whole genus, every rose whatever the species or variety. “All FUCHSIA \'Riccartonii\'” covers only plants with exactly that name, in every part of the garden. Tick “Only in [place]” to limit it to one place. New matching plants are included automatically. Use “One task for each plant” if each plant needs its own tick.</p>'+
  '<h4>Log</h4>'+
  '<p><b>Logging</b>: pick plants the same way as for tasks. “Job done” comes first, hours are optional. One entry can cover several dates, plants and jobs. Pick the matching task under “Related planned task” and it is ticked off in the Plan for that year; the entry then shows “✓ From plan”. Unplanned work counts as extra work: tick “Also add it to the Plan” to record it there as a finished task.</p>'+
  '<p><b>Filters</b>: Planned / Extra / All next to the search; place and task boxes (tick several); “Newest first ⇅” flips the order; Collapse all on the right.</p>'+
  '<h4>More</h4>'+
  '<p><b>Signing in</b>: each person signs in once on their phone with their name and password and stays signed in (More > Sign out). Only names on the list can sign in: the admin or a manager adds people in More > People and passes on the temporary password; the person chooses their own at the first sign-in (at least 4 characters). Forgot it? A manager taps Reset password and gives a new temporary one; nobody can see a password. After 5 wrong tries the name is locked for 5 minutes. Roles: View reads only; Edit changes plants, plans and logs and has My note; Manager also adds people and resets passwords. Your name goes on every change (“Last edited by …”). The old view and edit codes still work as a quick read-only way in.</p>'+
  '<p><b>My note</b>: a private note per plant, only for you. Nobody else sees it in the app, managers included. It is kept on your phone too, so it works offline. (The Google Sheet owner can still open the hidden “my notes” tab in Google.)</p>'+
  '<p><b>Buttons</b>: in every form, Delete (red) is on the left and Save on the right, far apart so it is hard to tap by mistake. Close is at the top.</p>'+
  '<p><b>Settings</b>: Edit places sets colours and map links. Edit task list renames, reorders and adds tasks (one line each: ↑ ↓ Rename Delete); tap a task name to change its dot colour, or use the rainbow circle to pick any colour. Each new task starts with the next unused colour.</p>'+
  '<p><b>Backup</b>: if the Apps Script backup was set up (see the update notes), a copy of the Google Sheet is saved weekly in Drive > “Hestercombe backups”.</p>'+
  '<p><b>Excel</b>: “Download Excel” saves Plants, Plan and Log as separate sheets.</p>'+
  '<h4>General</h4>'+
  '<p><b>Offline</b>: the app works without signal. Changes wait on the phone (see the status at the top) and are sent when you are back online.</p>'+
  '<p><b>Scrolling</b>: on a phone, the filters fold away as you scroll down and a slim bar shows the place (or month) you are in. Tap it for a list of all of them and jump straight there; “↓ Bottom” and “↑ Top” jump to the end or the start. The filters come back when you go to the top. The + button shrinks while you scroll.</p>'+
  '<p><b>Privacy</b>: the plant list, plans and logs are stored in the team’s Google Sheet and only load after signing in (or a valid code). They are then kept on the phone so the app works offline.</p>'+

function jumpTo(k){var jl=document.getElementById('jl');if(jl)jl.hidden=true;
  function go(){var h=$$('#app .grp>.hdr.gh').filter(function(x){return x.dataset.g===k})[0];if(!h)return;var y=h.getBoundingClientRect().top+window.scrollY-64;window.scrollTo({top:Math.max(y,130),behavior:'smooth'})}
  if(S.coll[k]){delete S.coll[k];renderAll();setTimeout(go,30)}else go()}
function openJump(){var jl=document.getElementById('jl');if(!jl.hidden){jl.hidden=true;return}var hs=miniHeads();if(!hs.length)return;var lim=70,cur=-1;hs.forEach(function(h,i){if(h.getBoundingClientRect().top<lim)cur=i});
  jl.innerHTML=hs.map(function(h,i){return '<button type="button" data-jk="'+esc(h.dataset.g)+'"'+(i===cur?' class="cur"':'')+'><span>'+miniLabel(h)+'</span><span class="jc">'+esc((h.querySelector('.cnt')||{}).textContent||'')+(i===cur?' ← you are here':'')+'</span></button>'}).join('');
  jl.hidden=false;$$('[data-jk]',jl).forEach(function(b){b.onclick=function(){jumpTo(b.dataset.jk)}})}
document.addEventListener('click',function(e){var jl=document.getElementById('jl');if(jl&&!jl.hidden&&!(e.target.closest&&(e.target.closest('#jl')||e.target.closest('#mini .mi'))))jl.hidden=true});
function miniBar(){var m=document.getElementById('mini');if(!m){m=document.createElement('div');m.id='mini';document.body.appendChild(m);var jl=document.createElement('div');jl.id='jl';jl.hidden=true;document.body.appendChild(jl)}
  var t=S.tab;if(t!=='plants'&&t!=='plan'&&t!=='log'){m.innerHTML='';document.body.classList.remove('hdr-hide');return}
  var pl=t==='plants'?S.pplace:t==='plan'?S.planPlace:S.logPlace,tk=t==='plan'?S.planTask:t==='log'?S.logEvent:[],parts=[];
  pl.forEach(function(p){parts.push('<span><i style="--dc:'+placeCol(p)+'"></i>'+esc(p)+'</span>')});
  tk.forEach(function(x){var c=tagColCls(x);parts.push('<span><i class="'+c.cls+'"'+(c.style?' style="'+c.style+'"':'')+'></i>'+esc(taskTxt(x))+'</span>')});
  if(parts.length>3)parts=parts.slice(0,2).concat(['<span>+'+(parts.length-2)+'</span>']);
  var none=t==='plants'?'All '+PLANTS.length+' plants':t==='plan'?'All tasks · '+(S.planAll?'all years':S.planYear):'All log entries';
  m.dataset.sum=parts.length?parts.join(''):'<span>'+esc(none)+'</span>';
  m.innerHTML='<button type="button" class="mi" aria-label="Jump to a group" data-k="x"></button><button type="button" class="mb" id="mBot">↓ Bottom</button><button type="button" class="mb" id="mTop">↑ Top</button>';
  m.querySelector('.mi').onclick=openJump;
  $('#mBot').onclick=function(){window.scrollTo({top:document.documentElement.scrollHeight,behavior:'smooth'})};
  $('#mTop').onclick=function(){var jl=$('#jl');if(jl)jl.hidden=true;window.scrollTo({top:0,behavior:'smooth'});document.body.classList.remove('hdr-hide')};
  miniCur()}
window.addEventListener('scroll',function(){
  var y=window.scrollY||0,dy=y-SC.last,b=document.body,small=!window.matchMedia||window.matchMedia('(max-width:799px)').matches;
  if(!small||S.tab==='more'){b.classList.remove('hdr-hide','hdr-compact','fab-mini');SC.last=y;return}
  b.classList.toggle('hdr-compact',y>40);
  if(y<120)b.classList.remove('hdr-hide');else if(dy>6)b.classList.add('hdr-hide');if(y<120){var jl0=document.getElementById('jl');if(jl0)jl0.hidden=true}else if(MINI_T==null)MINI_T=requestAnimationFrame(function(){MINI_T=null;miniCur()});
  if(dy>6&&y>60)b.classList.add('fab-mini');else if(dy<-6||y<60)b.classList.remove('fab-mini');
  clearTimeout(SC.idle);SC.idle=setTimeout(function(){b.classList.remove('fab-mini')},900);
  if(Math.abs(dy)>6)SC.last=y;
},{passive:true});
function renderAll(){
  applyRole();drawTabs();
  var app=$('#app');
  if(S.tab==='plants'){app.innerHTML=viewPlants();wirePlants()}
  else if(S.tab==='plan'){app.innerHTML=viewPlan();wirePlan()}
  else if(S.tab==='log'){app.innerHTML=viewLog();wireLog()}
  else{app.innerHTML=viewMore();wireMore()}
  refreshSheet();miniBar();
}

/* ---------- boot ---------- */
var STARTED=false;function lsGet(k){try{return localStorage.getItem(k)||''}catch(e){return ''}}
function startData(){if(STARTED)return;STARTED=true;sub('plantEdits');sub('tasks');sub('logs');sub('settings');myFetch();setInterval(myFlush,20000)}
if(MAPMODE)document.body.classList.add('mapmode');
buildPlants();renderAll();
(async function(){
  try{
    if(window.claude&&window.claude.use){
      db=await window.claude.use('db');
      downloads=await window.claude.use('downloads');
    }else if(HPL_API_URL){db=sheetDb(HPL_API_URL);downloads=fileDownloads()}
    else downloads=fileDownloads();
  }catch(e){db=null}
  if(db){
    S.useDb=true;
    if(MAPMODE){S.loaded={edits:true,tasks:true,logs:true,settings:true}}
    else if(HPL_API_URL&&!window.claude&&!TOKEN&&!lsGet('hpl_pass')){showSignIn()}
    else if(USER&&TOKEN&&USER.mustChange){showSignIn('','change')}
    else startData();
  }else{
    S.edits=loadLocal('edits');S.tasks=loadLocal('tasks');S.logs=loadLocal('logs');S.settings=loadLocal('settings');
    S.loaded={edits:true,tasks:true,logs:true,settings:true};buildPlants();
  }
  renderAll();
  if(MAPMODE){document.title='Map · '+MAPMODE;openMap(MAPMODE)}
})();
})();
</script>
</body></html>
