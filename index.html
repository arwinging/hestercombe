<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#F1F4EE"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Garden"><meta name="apple-mobile-web-app-status-bar-style" content="default"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-180.png"><link rel="icon" href="icon-192.png"><style>html,body{margin:0}</style></head><body><title>Hestercombe Plants</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Merriweather:ital,wght@0,400;0,700;1,400;1,700&display=swap">
<style>
/* Layout: one narrow column app, sticky filter bar on top, bottom tab bar, bottom sheets for detail and forms.
   Colour: chalk-green paper, ink-green text, madder-rose accent (the garden is mostly roses), leaf green = done.
   Place colours are the ones from the original sheet and can be changed in the app (Places). */
:root{
  --bg:#F1F4EE; --surface:#FFFFFF; --ink:#1B261F; --muted:#5B695F; --line:#D9E0D6;
  --accent:#A62F57; --accent-ink:#FFFFFF; --accent-soft:#F6E2E9;
  --task:#A82D08; --task-ink:#FFFFFF; --task-soft:#F4DDD5; --logc:#005F73; --logc-ink:#FFFFFF; --logc-soft:#D5E8EC;
  --leaf:#006631; --leaf-ink:#FFFFFF; --leaf-soft:#D9EBDF; --warn:#8A5A00; --warn-soft:#FAEBC8;
  --ui:'Instrument Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --latin:'Merriweather',Georgia,'Times New Roman',serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1511; --surface:#171F1A; --ink:#E5ECE6; --muted:#9BA99F; --line:#2A362E;
  --accent:#E5809F; --accent-ink:#1E0B13; --accent-soft:#3A202B;
  --task:#E8987C; --task-ink:#2A0F06; --task-soft:#40211A; --logc:#6BC4D6; --logc-ink:#06232A; --logc-soft:#12333B;
  --leaf:#7FC799; --leaf-ink:#0C1F14; --leaf-soft:#1C3024; --warn:#E6B65A; --warn-soft:#3A2E12; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1511; --surface:#171F1A; --ink:#E5ECE6; --muted:#9BA99F; --line:#2A362E;
  --accent:#E5809F; --accent-ink:#1E0B13; --accent-soft:#3A202B;
  --task:#E8987C; --task-ink:#2A0F06; --task-soft:#40211A; --logc:#6BC4D6; --logc-ink:#06232A; --logc-soft:#12333B;
  --leaf:#7FC799; --leaf-ink:#0C1F14; --leaf-soft:#1C3024; --warn:#E6B65A; --warn-soft:#3A2E12; color-scheme:dark}

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--ui);
  padding-block:0 96px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto}
.latin{font-family:var(--latin);font-size:.94em;line-height:1.35}
.latin i{font-style:italic}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding:14px 0 10px;border-bottom:1px solid var(--line)}
.top.static{position:static}
.top h1{margin:0 0 10px;font-size:26px;line-height:1.1;letter-spacing:-.4px;font-weight:700;color:var(--ink);display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.top h1 span.right{font-size:13px;letter-spacing:0;font-weight:500;color:var(--muted);display:flex;gap:8px;align-items:center}
.bar{display:flex;gap:8px;flex-wrap:wrap}
.bar > *{min-width:0}
.input,.select,.textarea{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;min-height:44px}
.textarea{min-height:88px;resize:vertical}
.input:focus,.select:focus,.textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 2px var(--accent-soft)}
.grow{flex:1 1 110px}
.brk{flex-basis:100%;height:0}
.bar .seg.sm{align-self:stretch;flex:none}.bar .seg.sm button{min-height:0;height:100%;padding:0 8px}
.half{flex:1 1 130px}
.xp{border:1px solid var(--line);border-radius:10px;padding:10px 12px 2px;margin-bottom:10px;background:var(--surface)}
.xp-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.jrow{border:1px solid var(--line);border-radius:10px;padding:10px 12px 8px;margin-bottom:10px;display:grid;gap:0;background:var(--surface)}
.jrow .field{margin-bottom:8px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:0 12px;min-height:44px;color:var(--muted);font-weight:500}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.meta{color:var(--muted);font-size:13px;margin:10px 0 4px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center}
.meta a{color:var(--accent)}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:0 14px;min-height:44px;font-weight:600}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--accent);border-color:var(--accent)}
.btn.ghost{background:none}
.btn.sm{min-height:36px;padding:0 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}

.list{display:flex;flex-direction:column}
.hdr{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:18px 0 6px;display:flex;gap:8px;align-items:center}
.gh{width:100%;background:none;border:0;border-bottom:1px solid var(--line);text-align:left;padding:14px 2px 8px;min-height:48px}
.gh .cnt{margin-left:auto;letter-spacing:0;font-variant-numeric:tabular-nums}
.gh .gl{display:inline-flex;gap:8px;align-items:center;letter-spacing:0;text-transform:none;font-size:14px;color:var(--ink)}
.chev{width:9px;height:9px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);transition:transform .15s;flex:none;margin:-3px 4px 0 2px}
.gh[aria-expanded="false"] .chev{transform:rotate(-45deg);margin-top:0}
.fold2:not([open]) .chev,.fold:not([open])>summary .chev{transform:rotate(-45deg);margin-top:0}
.ftl{display:inline-flex;align-items:center;gap:8px}
.tag-now{background:var(--accent);color:var(--accent-ink);border-radius:4px;padding:1px 6px;letter-spacing:0;text-transform:none;font-size:11px}
.tag-warn{background:var(--warn-soft);color:var(--warn);border-radius:4px;padding:1px 6px;letter-spacing:0;text-transform:none;font-size:11px}
.row{display:flex;gap:16px;align-items:flex-start;justify-content:space-between;text-align:left;width:100%;background:none;border:0;border-bottom:1px solid var(--line);padding:7px 2px;min-height:44px}
.row:hover{background:var(--surface)}
.r-main{min-width:0;flex:1;display:flex;flex-direction:column;gap:2px}
.prow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;column-gap:12px;row-gap:2px;align-items:baseline}
.prow>.r-main{grid-column:2}.prow>.r-side{grid-column:3;max-width:none}.prow>.r-side .pl{max-width:44vw}
.prow>.r-line{grid-column:2/-1}.prow .dots{align-items:baseline}.prow .dots .olink{margin-left:4px}
.num{flex:none;min-width:40px;text-align:right;font-variant-numeric:tabular-nums;font-weight:700;color:var(--muted);font-size:14px;padding-top:1px}
.r-sub{color:var(--muted);font-size:13px;overflow-wrap:anywhere}
.r-side{flex:none;text-align:right;display:flex;flex-direction:column;gap:2px;align-items:flex-end;font-size:13px;color:var(--muted);max-width:42%}
.r-side .no{font-variant-numeric:tabular-nums;font-weight:600;color:var(--ink)}
.r-line{display:flex;align-items:baseline;justify-content:space-between;gap:8px;min-width:0}
.r-line .rc{flex:1 1 auto;min-width:0;margin:0}
.dots{display:flex;gap:5px;flex:0 1 auto;justify-content:flex-end;flex-wrap:wrap;margin-left:auto}
.nt{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--muted);padding:0 2px;line-height:1.7}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:1px 8px;font-size:12px;font-weight:600;background:var(--line);color:var(--ink)}
.pill.a{background:var(--accent-soft);color:var(--accent)}
.pill.l{background:var(--leaf-soft);color:var(--leaf)}
.pl{display:inline-block;border-radius:4px;font-size:14px;font-weight:600;line-height:1.5;padding:0 7px;overflow-wrap:anywhere;background:var(--line);color:var(--ink)}
.sep{margin:0 10px;opacity:.55}
.cols{display:flex;flex-wrap:wrap;gap:0 20px}
.btn.task{background:var(--task);border-color:var(--task);color:var(--task-ink)}
.btn.logc{background:var(--logc);border-color:var(--logc);color:var(--logc-ink)}
.btn.leaf{background:var(--leaf);border-color:var(--leaf);color:var(--leaf-ink)}
.btn.edit{border:1.5px solid var(--leaf);color:var(--leaf);background:var(--leaf-soft)}
.vbar{display:flex;gap:4px;align-items:center;margin-top:8px;flex-wrap:wrap}
.vbar .select{width:auto;max-width:190px;min-height:36px;padding:6px 10px;font-size:13px;background:none}
.ibt{display:inline-flex;align-items:center;gap:7px}.ibt svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ib{width:36px;height:36px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--muted);display:grid;place-items:center;flex:none;padding:0}
.ib svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.vrow{display:flex;width:100%;align-items:center;justify-content:space-between;gap:8px}
.seg.sm{border-radius:999px;background:none;border-color:var(--line)}.seg.sm button{min-height:28px;padding:0 11px;font-size:12.5px}.seg.sm button[aria-pressed="true"]{background:color-mix(in srgb,var(--ink) 11%,var(--surface));color:var(--ink);font-weight:700}
.ckl{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);font-weight:500;min-height:36px;padding:0 6px}.ckl input{width:16px;height:16px;margin:0;accent-color:var(--leaf)}
.vbtn{background:none;border:0;color:var(--muted);font-size:13px;font-weight:600;min-height:36px;padding:0 8px;text-decoration:underline;text-underline-offset:3px}
.vsp{flex:1}
.vend{margin-left:auto;display:flex;gap:2px;align-items:center;flex:none}
.edl{margin:0 0 10px}
.ht{display:inline-flex;align-items:center;gap:10px;min-width:0}
.hic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none}
.hic.big svg{width:26px;height:26px;stroke-width:1.5}
.hic svg{width:22px;height:22px;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.hic.leaf{background:var(--leaf-soft)}.hic.leaf svg{stroke:var(--leaf)}
.hic.task{background:var(--task-soft)}.hic.task svg{stroke:var(--task)}
.hic.logc{background:var(--logc-soft)}.hic.logc svg{stroke:var(--logc)}
.le{display:flex;gap:14px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:10px 2px;align-items:flex-start}
.le:hover{background:var(--surface)}
.le-d{flex:none;width:88px;color:var(--muted);font-size:13px;padding-top:2px;font-variant-numeric:tabular-nums}
.le-b{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.le-b .det{white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px}
.gl{min-width:0;flex-wrap:wrap}
.gl .num{min-width:0;padding:0}
.pb{margin:2px 0 8px}
.pb-h{display:flex;gap:10px;align-items:center;flex-wrap:wrap;width:100%;text-align:left;background:var(--surface);border:0;border-bottom:1px solid var(--line);padding:10px 8px;min-height:44px;margin-top:8px;border-radius:8px 8px 0 0}
.pb-h .num{min-width:0;padding:0}
.plink{display:block;margin:0 0 0 auto;min-height:32px}
.drow{display:flex;gap:6px;margin-bottom:6px;align-items:center}.drow .input{flex:1}
.sh{display:flex;gap:8px;align-items:center;justify-content:space-between;width:calc(100% - 16px);margin:6px 0 0 16px;padding:8px 2px 6px;min-height:40px;text-align:left;background:none;border:0;border-bottom:1px dashed var(--line);font-size:13px;font-weight:600;color:var(--ink);letter-spacing:0;text-transform:none}
.subl{margin-left:16px;border-left:2px solid var(--line);padding-left:8px}
.card .num{align-self:flex-start}
.sh .cnt{color:var(--muted);font-variant-numeric:tabular-nums}
.sh .gl{display:inline-flex;gap:8px;align-items:center;font-size:13px}
.yearbar{display:flex;align-items:center;gap:10px;background:var(--accent);color:var(--accent-ink);border-radius:12px;padding:6px 8px;margin:0 0 10px}
.yearbar button{flex:none;width:48px;height:48px;border-radius:10px;border:0;background:rgba(255,255,255,.18);color:inherit;font-size:26px;line-height:1;font-weight:600}
.yearbar .yv{border:0;background:none;color:inherit;font:inherit;flex:1;text-align:center;display:flex;flex-direction:column;line-height:1.15}
.yearbar .yv b{font-size:30px;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.yearbar .yv span{font-size:12px;opacity:.9}
.ypill{display:inline-block;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:1px 9px;font-size:12px;letter-spacing:0;font-weight:700}
.card .r-side{padding-top:2px}
.idrow{display:flex;gap:10px;align-items:baseline;min-width:0}
.card .chk+.body{margin-left:-8px}
.idrow .num{min-width:22px;text-align:right;flex:none;padding:0}
.idrow .latin{min-width:0}
.idsp{flex:1}
.lrow{display:flex;align-items:baseline;gap:8px;min-width:0}.lrow>.r-sub{min-width:0}
.r-side .pl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.lchip{margin-left:auto;flex:1 1 90px;min-width:90px;max-width:46%;display:flex;justify-content:flex-end;line-height:1.2}.lchip .pl{font-size:12.5px;padding:0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.idrow .pl{flex:none;align-self:center}
.sh .pl,.r-side .pl,.pb-h .pl,.plantg .hdr .pl,.idrow .pl,.gsum .pl{font-size:12.5px;padding:0 6px}
.pn2{grid-template-columns:minmax(0,1fr) 96px;gap:8px}
.fold2>summary{list-style:none;cursor:pointer}.fold2>summary::-webkit-details-marker{display:none}.fold2>summary h3{margin-bottom:6px}
.fbt{display:inline-flex;align-items:center;gap:10px}.pm::after{content:'+';font-size:20px;font-weight:500;color:var(--muted);letter-spacing:0;line-height:1;display:inline-block;width:14px;text-align:center}.fold2[open] .pm::after{content:'−'}
.ibt{justify-content:center}
.fold>summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;margin-bottom:0;padding-bottom:10px}.fold>summary::-webkit-details-marker{display:none}
.fold>summary{justify-content:flex-start}
.help details{margin:0 0 6px}.help details summary{cursor:pointer;color:var(--accent);font-weight:600;font-size:14px;padding:4px 0}.help details p{margin:6px 0}
.gh,.row{cursor:pointer}
.grp.plantg{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin:12px 0;padding:0 12px 4px}
.grp.plantg .gh{border-bottom:1px solid var(--line);padding-top:12px}
.grp.plantg .le:last-child{border-bottom:0}
.sug-row{display:flex;gap:10px;align-items:baseline;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:8px 10px;min-height:44px}
.sug-row:last-child{border-bottom:0}
.sug-row .num{min-width:26px;text-align:right;padding:0}
.sug-row .pl{align-self:center;flex:none}
.gname{display:inline-flex;align-items:baseline;gap:6px}
.gall{border:1px dashed color-mix(in srgb,var(--leaf) 60%,transparent);border-radius:5px;padding:0 5px;line-height:1.35}
.gall,.gbadge{font-family:var(--latin);font-style:italic;font-size:12.5px;font-weight:400;color:var(--leaf)}
.gbadge-x{flex:none;align-self:center;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--leaf);background:var(--leaf-soft);border:1px solid color-mix(in srgb,var(--leaf) 35%,transparent);border-radius:5px;padding:1px 6px;line-height:1.4}
.gsum{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;margin:2px 0}
.gp{display:inline-flex;gap:5px;align-items:center}
.pn{display:inline-flex;gap:6px;align-items:center;justify-content:flex-end;flex-wrap:wrap}
.pn .no{font-variant-numeric:tabular-nums;font-weight:700;color:var(--ink)}
.olink{display:inline-block;white-space:nowrap;flex:none;color:var(--accent);font-size:12px;font-weight:600;text-transform:none;letter-spacing:0;text-decoration:underline;text-underline-offset:3px;padding:4px 2px;cursor:pointer}
.l1{display:flex;gap:4px 10px;flex-wrap:wrap;align-items:baseline}
.pnote{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;color:var(--muted);font-size:13px;margin-top:2px}
.field > label.rad,.rad{font-size:15px;font-weight:500;color:var(--ink);display:flex;gap:10px;align-items:center;min-height:30px}
.fsec{border-radius:12px;padding:12px 12px 2px;margin-bottom:14px}
.fs-plant{background:color-mix(in srgb,var(--ink) 6%,var(--surface));border:1px solid var(--line)}
.fs-job{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent)}
.fs-h{font-size:11.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.fs-plant .xp{background:var(--surface)}
.rad input{width:20px;height:20px;flex:none}
.rad.indent{margin-left:30px;min-height:36px;color:var(--muted);font-size:14px}
.pick{max-height:220px;overflow:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface);margin:4px 0 0 30px}
.pick label{display:flex;gap:10px;align-items:center;padding:6px 10px;border-bottom:1px solid var(--line);min-height:40px;font-size:14px}
.pick label:last-child{border-bottom:0}
.pick input{width:18px;height:18px;flex:none}
.prow{padding:10px 0;border-bottom:1px solid var(--line)}
.prow-h{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-bottom:6px}
.prow-b{display:flex;gap:6px;align-items:center}
.prow-b .input{min-height:40px;padding:6px 10px;font-size:14px}
.clr{width:44px;height:40px;flex:none;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:3px}
.more{margin:14px 0;width:100%}

.card{display:flex;gap:12px;padding:12px 2px;border-bottom:1px solid var(--line);align-items:flex-start}
.card .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;cursor:pointer;background:none;border:0;text-align:left;padding:0}
.card .det{white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px}
.chk{flex:none;width:44px;height:44px;margin:-6px -6px -6px -8px;display:grid;place-items:center;background:none;border:0}
.chk span{width:24px;height:24px;border-radius:50%;border:2px solid var(--muted);display:grid;place-items:center}
.chk[aria-pressed="true"] span{background:var(--leaf);border-color:var(--leaf)}
.chk svg{width:14px;height:14px;stroke:var(--bg);fill:none;stroke-width:3;opacity:0}
.chk[aria-pressed="true"] svg{opacity:1}
.done .latin,.done .det{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--muted)}
.tk{display:inline-flex;align-items:center;gap:.45em;font-weight:700;font-size:14px;letter-spacing:.03em;line-height:1.5}

function genusSummary(t){
  if(!isGroup(t.name))return '';
  var ms=PLANTS.filter(function(p){return entryMatches(t,p)});
  if(!ms.length)return '<span class="gsum r-sub">No matching plants yet</span>';
  var by={},order=[];ms.forEach(function(p){if(!by[p.place]){by[p.place]=[];order.push(p.place)}by[p.place].push(p)});
  order.sort(function(a,b){return placeIdx(a)-placeIdx(b)});
  var few=ms.length<=15;
  return '<span class="gsum"><span class="r-sub"><b>'+ms.length+' plant'+(ms.length>1?'s':'')+'</b></span>'+order.map(function(pl){
    var l=by[pl].sort(function(a,b){return noKey(a.no)-noKey(b.no)});
    return '<span class="gp">'+placeChip(pl)+'<span class="r-sub">'+(few?l.map(function(p){return esc(p.no||'–')}).join(', '):'×'+l.length)+'</span></span>'}).join('')+'</span>';
}
function genusPlantsHtml(t){
  if(!isGroup(t.name))return '';
  var ms=PLANTS.filter(function(p){return entryMatches(t,p)}).sort(function(a,b){return placeIdx(a.place)-placeIdx(b.place)||noKey(a.no)-noKey(b.no)});
  if(!ms.length)return '';
  return '<div class="sec"><h3><span>Plants this task covers ('+ms.length+')</span></h3><div class="pick" style="margin-left:0;max-height:260px">'+ms.map(function(p){return '<button type="button" class="sug-row" data-open="'+p.id+'"><span class="num">'+esc(p.no||'–')+'</span><span class="latin">'+nameHtml(p.name)+'</span><span class="idsp"></span>'+placeChip(p.place)+'<span class="olink">Open ›</span></button>'}).join('')+'</div></div>';
}

/* ---------- plant + scope block (this plant only / all of a genus / choose plants); used for the main plant and each extra plant ---------- */
function plantScope(P,onChange,editing,noun){noun=noun||'task';
  var ks={mode:'plant',onlyPlace:false,sel:{},q:'',init:false,groups:[],gi:0,list:[]};
    function lockFields(on){}
    function computeGroups(pv){
      var w=String(pv.name||'').trim().split(/\s+/).filter(Boolean),out=[],seen={};
      for(var n=w.length;n>=1&&out.length<3;n--){
        var pre=norm(w.slice(0,n).join(' '));
        var m=PLANTS.filter(function(p){var x=norm(p.name);return x===pre||x.indexOf(pre+' ')===0});
        if(m.length<2)continue;
        var key=m.map(function(p){return p.id}).join(',');if(seen[key])continue;seen[key]=1;
        out.push({name:w[0].toUpperCase()+(n>1?' '+w.slice(1,n).join(' '):''),list:m});
      }
      return out;
    }
    function curGroup(){return ks.groups&&ks.groups[ks.gi]}
    function applyFields(){
      var pl=$('#'+P+'-place'),no=$('#'+P+'-no'),nm=$('#'+P+'-name');if(!ks.src)return;
      var sg=$('#'+P+'-sug');if(sg&&ks.mode!=='plant')sg.innerHTML='';
      if(ks.mode==='group'&&curGroup()){nm.value=curGroup().name;no.value='';pl.value=ks.onlyPlace?ks.src.place:'';lockFields(true)}
      else if(ks.mode==='pick'){pl.value=ks.src.place;no.value=ks.src.no;nm.value=ks.src.name;lockFields(true)}
      else{pl.value=ks.src.place;no.value=ks.src.no;nm.value=ks.src.name;lockFields(false)}
      nm.parentNode.classList.toggle('has',!!nm.value);
    }
    function setMode(m,gi){
      if(ks.mode==='plant'&&m!=='plant'){ks.src=pickerVals(P);ks.groups=computeGroups(ks.src)}
      ks.gi=gi||0;ks.mode=m;applyFields();drawScope();if(onChange)onChange();
    }
    function pickVisible(){
      var q=norm(ks.q).split(' ').filter(Boolean);
      if(q.length)return PLANTS.filter(function(p){var h=norm(p.name+' '+p.common+' '+p.jekyll+' '+p.place);return wmatch(h,q)}).sort(function(a,b){return norm(a.name).localeCompare(norm(b.name))||placeIdx(a.place)-placeIdx(b.place)||noKey(a.no)-noKey(b.no)}).slice(0,120);
      var seen={},out=ks.list.slice();out.forEach(function(p){seen[p.id]=1});
      PLANTS.forEach(function(p){if(ks.sel[p.id]&&!seen[p.id])out.push(p)});
      return out;
    }
    function pickCount(){var n=0;for(var k in ks.sel)if(ks.sel[k])n++;return n}
    function drawPickList(){
      var box=$('#'+P+'-picklist');if(!box)return;
      var vis=pickVisible();
      box.innerHTML=(vis.length?vis.map(function(p){return '<label><input type="checkbox" data-pk="'+p.id+'"'+(ks.sel[p.id]?' checked':'')+'> <span><span class="latin">'+nameHtml(p.name)+'</span> <span class="r-sub">'+esc(p.place)+(p.no?SEP+esc(p.no):'')+'</span></span></label>'}).join(''):'<div class="r-sub" style="padding:10px">'+(ks.q?'No plants match.':'Search above to find plants.')+'</div>');
      var c=$('#'+P+'-pickcount');if(c)c.textContent=pickCount()+' selected';
      $$('[data-pk]',box).forEach(function(cb){cb.onchange=function(){if(cb.checked)ks.sel[cb.dataset.pk]=true;else delete ks.sel[cb.dataset.pk];var c2=$('#'+P+'-pickcount');if(c2)c2.textContent=pickCount()+' selected';if(onChange)onChange()}});
    }
    function drawScope(){
      var box=$('#'+P+'-scopebox');if(!box)return;
      var pv=ks.mode==='plant'?pickerVals(P):(ks.src||{place:'',no:'',name:''});
      var groups=computeGroups(pv);ks.groups=groups;
      if(ks.mode==='group'&&!groups[ks.gi]){ks.mode='plant';applyFields()}
      var gr=ks.mode==='group'?groups[ks.gi]:null;
      var base=groups.length?groups[0].list:[];
      ks.list=ks.mode==='group'?(ks.onlyPlace&&pv.place?gr.list.filter(function(p){return p.place===pv.place}):gr.list):base;
      if(ks.mode==='pick'&&!ks.init){ks.init=true;base.forEach(function(p){ks.sel[p.id]=true})}
      var h='<span class="lbl">Apply to</span>'+
        '<label class="rad"><input type="radio" name="'+P+'-scope" value="plant"'+(ks.mode==='plant'?' checked':'')+'> This plant only</label>'+
        groups.map(function(g,gi){var n=(ks.mode==='group'&&ks.gi===gi)?ks.list.length:g.list.length;return '<label class="rad"><input type="radio" name="'+P+'-scope" value="g'+gi+'"'+(ks.mode==='group'&&ks.gi===gi?' checked':'')+'> <span>All '+esc(g.name)+' ('+n+' plants), as one '+noun+'</span></label>'}).join('')+
        '<label class="rad"><input type="radio" name="'+P+'-scope" value="pick"'+(ks.mode==='pick'?' checked':'')+'> Choose plants, one '+noun+' each</label>';
      if(ks.mode==='group'&&pv.place)h+='<label class="rad indent"><input type="checkbox" id="'+P+'-onlyp"'+(ks.onlyPlace?' checked':'')+'> Only in '+esc(pv.place)+'</label>';
      if(ks.mode==='group')h+='<div class="r-sub" style="margin:4px 0 0 30px">Saved as one '+noun+' named '+esc(gr.name)+', with the number cleared'+(ks.onlyPlace?'':' and the place set to none')+'. It applies to the plants below.</div>'+
        '<div class="pick" style="max-height:240px">'+ks.list.slice().sort(function(a,b){return placeIdx(a.place)-placeIdx(b.place)||noKey(a.no)-noKey(b.no)}).map(function(p){return '<button type="button" class="sug-row" data-open="'+p.id+'"><span class="num">'+esc(p.no||'–')+'</span><span class="latin">'+nameHtml(p.name)+'</span><span class="idsp"></span>'+placeChip(p.place)+'<span class="olink">Open ›</span></button>'}).join('')+'</div>';
      if(ks.mode==='pick')h+='<div style="margin:6px 0 0 30px"><input class="input" id="'+P+'-pq" type="search" placeholder="Search plants to tick, e.g. clematis montana" value="'+esc(ks.q)+'" autocomplete="off"></div>'+
        '<div style="margin-left:30px;display:flex;align-items:center;gap:4px;flex-wrap:wrap"><button type="button" class="vbtn" id="'+P+'-all">Select all</button><button type="button" class="vbtn" id="'+P+'-none">Select none</button><span class="r-sub" id="'+P+'-pickcount" style="margin-left:auto"></span></div><div class="pick" id="'+P+'-picklist"></div>';
      box.innerHTML=h;
      $$('input[name="'+P+'-scope"]',box).forEach(function(r){r.onchange=function(){if(r.value==='plant')setMode('plant');else if(r.value==='pick')setMode('pick');else setMode('group',parseInt(r.value.slice(1),10))}});
      var op=$('#'+P+'-onlyp');if(op)op.onchange=function(){ks.onlyPlace=op.checked;applyFields();drawScope()};
      $$('[data-open]',box).forEach(function(b){b.onclick=function(){openPlant(b.dataset.open)}});
      var pq=$('#'+P+'-pq');if(pq)pq.addEventListener('input',function(){ks.q=pq.value;drawPickList()});
      var sa=$('#'+P+'-all'),sn=$('#'+P+'-none');
      if(sa)sa.onclick=function(){pickVisible().forEach(function(p){ks.sel[p.id]=true});drawPickList()};
      if(sn)sn.onclick=function(){pickVisible().forEach(function(p){delete ks.sel[p.id]});drawPickList()};
      drawPickList();
    }
  function pickN(){return pickCount()}
  function targets(){
    var pv=pickerVals(P);
    if(ks.mode==='group'&&ks.groups[ks.gi]&&ks.list.length){var g=ks.groups[ks.gi];return [{place:(ks.onlyPlace&&pv.place)?pv.place:'',no:'',name:g.name}]}
    if(ks.mode==='pick')return PLANTS.filter(function(p){return ks.sel[p.id]}).map(function(p){return {place:p.place,no:p.no,name:p.name}});
    return (pv.name||pv.place)?[{place:pv.place,no:pv.no,name:pv.name}]:[];
  }
  function size(){return ks.mode==='pick'?pickCount():1}
  /* typing in the plant boxes while a group / pick mode is on returns to "this plant only" with what was typed */
  ['name','no'].forEach(function(f){var el=$('#'+P+'-'+f);el.addEventListener('input',back)});
  $('#'+P+'-place').addEventListener('change',back);
  function back(){if(ks.mode!=='plant'){ks.mode='plant';ks.init=false;ks.sel={};ks.src=null}}
  wirePicker(P,function(){drawScope();if(onChange)onChange()});drawScope();
  return {ks:ks,pickCount:pickCount,targets:targets,size:size};
}

/* ---------- grouping ---------- */
function groupedHtml(tab,groupBy,items,cfg,renderItem,subBy){
  S.keys[tab]=[];
  var g=cfg[groupBy];
  if(!g)return '<div class="list">'+items.map(renderItem).join('')+'</div>';
  var map={},keys=[],has=function(o,k){return Object.prototype.hasOwnProperty.call(o,k)};
  items.forEach(function(it){var k=g.key(it);if(!has(map,k)){map[k]=[];keys.push(k)}map[k].push(it)});
  keys.sort(g.cmp);
  return keys.map(function(k){
    var ck=tab+':'+groupBy+':'+k;S.keys[tab].push(ck);
    var open=!S.coll[ck],inner='';
    if(open){
      var useSub=subBy&&subBy!=='none'&&subBy!==groupBy&&cfg[subBy]&&!(groupBy==='plant'&&(subBy==='place'||subBy==='genus'));
      if(g.block&&!useSub)inner=g.block(map[k],k);
      else if(useSub){
        var sg=cfg[subBy],sm={},sk=[];
        map[k].forEach(function(it){var kk=sg.key(it);if(!has(sm,kk)){sm[kk]=[];sk.push(kk)}sm[kk].push(it)});
        sk.sort(sg.cmp);
        inner=sk.map(function(kk){var sck=ck+':sub:'+kk;S.keys[tab].push(sck);var so=!S.coll[sck];return '<button class="sh gh" data-g="'+esc(sck)+'" aria-expanded="'+so+'"><span class="gl"><span class="chev"></span>'+sg.label(kk)+'</span><span class="cnt">'+sm[kk].length+'</span></button>'+(so?'<div class="list subl">'+sm[kk].map(g.subRender||renderItem).join('')+'</div>':'')}).join('');
      }else inner='<div class="list">'+map[k].map(renderItem).join('')+'</div>';
    }
    return '<div class="grp g-'+groupBy+(g.cls?' '+g.cls:'')+'"><div class="hdr gh" role="button" tabindex="0" data-g="'+esc(ck)+'" aria-expanded="'+open+'"><span class="gl"><span class="chev"></span>'+g.label(k)+'</span>'+(g.badge?g.badge(k):'')+'<span class="cnt">'+map[k].length+'</span></div>'+inner+'</div>';
  }).join('');
}
function plantGroups(recOf,entry){

  function pcmp(a,b){var x=PK[a],y=PK[b];return placeIdx(x.place)-placeIdx(y.place)||noKey(x.no)-noKey(y.no)||norm(x.name).localeCompare(norm(y.name))}
  function head(k){var x=PK[k];return (x.no?'<span class="num">'+esc(x.no)+'</span>':'')+(x.name?'<span class="latin">'+nameHtml(x.name)+'</span>':'<span class="r-sub">Whole place</span>')+openBtn(x.place,x.no,x.name)+placeChip(x.place)}
  return {
    plant:{cls:'plantg',key:pk,label:head,cmp:pcmp,block:function(items){return '<div class="list">'+items.map(entry).join('')+'</div>'}},
    genusBlock:function(items){var m={},ks=[];items.forEach(function(id){var k=pk(id);if(!m[k]){m[k]=[];ks.push(k)}m[k].push(id)});ks.sort(pcmp);

  };
}

  var op=Object.keys(S.tasks).filter(function(i){return isOpen(S.tasks[i],CUR)}).length;
  return '<div class="top"><h1><span>More</span></h1></div><div class="wrap">'+banners()+
  '<div class="stat"><div><b>'+PLANTS.length+'</b><span>plants</span></div><div><b>'+op+'</b><span>open tasks this year</span></div><div><b>'+Object.keys(S.logs).length+'</b><span>log entries</span></div></div>'+
  (db&&db.unlock?'<div class="sec"><h3>Access</h3><p class="r-sub" style="margin:0 0 8px">'+(ROLE==='view'?'You are in read-only mode. You can search and read everything.':'Editing is unlocked on this device.')+'</p>'+(ROLE==='view'?'<div class="actions"><button class="btn primary" id="unlockEdit">Unlock editing</button></div>':'<p class="r-sub" style="margin:0 0 8px">Your name on edits: <b>'+(EDITOR?esc(EDITOR):'not set')+'</b></p><div class="actions"><button class="btn" id="setName">'+(EDITOR?'Change name':'Set your name')+'</button></div>')+'</div>':'')+
  '<div class="sec"><h3>Settings</h3><div class="actions"><button class="btn ibt" id="openPlaces">'+IB.pin+'Edit places</button><button class="btn ibt" id="openTypes">'+IB.list+'Edit task list</button></div></div>'+
  foldSec('m-places','Places and maps ('+places().length+')','',places().map(function(p){return '<div class="placerow">'+placeChip(p)+(mapOf(p)?'<a href="'+esc(mapOf(p))+'" target="_blank" rel="noopener">Open map</a>':'<span class="r-sub">No map yet</span>')+'</div>'}).join(''),false)+
  '<div class="sec"><h3>Export</h3><div class="actions">'+(db&&db.call?'<button class="btn primary" id="expXlsx">Download Excel (.xlsx)</button>':'')+'<button class="btn" data-exp="plants">Plants</button><button class="btn" data-exp="tasks">Plan</button><button class="btn" data-exp="logs">Log</button></div></div>'+
  foldSec('m-help','How it works','',
  '<p><b>Plants</b>: search and browse every plant. Open one to see its details, planned tasks and log history.</p>'+
  '<p><b>Plan</b>: tasks to do, by year. Tick the circle when a task is done for the year shown at the top.</p>'+
  '<p><b>Log</b>: a record of work done, with date, task and hours.</p>'+
  '<p><b>Group tasks</b> <span class="gname latin">FUCHSIA<span class="gall">all</span></span>: one task for many plants: a whole genus (ROSA) or one kind everywhere (FUCHSIA \'Riccartonii\').</p>'+
  '<details><summary>More detail</summary>'+
  '<p><b>Searching</b>: type the start of any word in the botanical, common or Jekyll name, or a place. Tap × to clear. Next to the search box, Plan has Open / Done / All and Log has Planned / Extra / All. Below are the place and task filters, then the grouping menus. On the right, Expand all / Collapse all opens or closes every group, and in Log, Newest / Oldest first beside it flips the order. “Task tags” on the Plants page shows or hides each plant’s open tasks and log count. Long place names are shortened on cards; open the entry to see the full name.</p>'+
  '<p><b>Adding tasks and logs</b>: type a botanical name and pick from the list. Then choose “This plant only”, “All … as one task” for a whole genus (for example all ROSA), or “Choose plants” to tick several. “+ Add more plants” and “+ Add another task” save every combination, for example 2 plants × 2 tasks = 4 entries. A log can cover several dates at once.</p>'+
  '<p><b>Group tasks in detail</b>: pick a plant, then choose one of two group options. “All ROSA” covers the whole genus: every rose, whatever the species or variety. “All FUCHSIA \'Riccartonii\'” covers only plants with exactly that name (the same species or variety), in every part of the garden. The genus is saved in capitals and the number is left blank. Tick “Only in [place]” to limit it to the place you picked. A group task has a small dashed “all” label after its name, lists the plants it covers, and shows on each of those plants’ pages. New plants with a matching name are included automatically. Use “Choose plants, one task each” instead if each plant needs its own tick.</p>'+
  '<p><b>Repeats</b>: a task can repeat every year, every few years, only once, or in chosen years. Each year is ticked off separately, so a yearly task comes back every year and earlier years stay in the history. Use the year bar or “All years” in Plan to look back or ahead. “First year it applies” starts at the current year; pick “Other year…” to type any year.</p>'+
  '<p><b>Plan and Log together</b>: when logging, pick the matching task under “Related planned task” and it is ticked off for that year; the log entry then shows “✓ From plan”. Work that was not planned is fine: it counts as extra work (use “Extra” next to the Log search to list it), and tick “Also add it to the Plan” (in a new or edited log) to record it in the Plan as a finished task.</p>'+
  '<p><b>Editing</b>: with the view code you can search and read; tap “Unlock editing” above and enter the edit code to make changes. Before the first edit the app asks for your name (change it any time under More > Access), and each change shows “Last edited by …”.</p>'+
  '<p><b>Offline</b>: the app works without signal. Changes wait on the phone (see the status at the top) and are sent when you are back online.</p>'+
  '<p><b>Privacy</b>: the plant list, plans and logs are stored in the team’s Google Sheet and only load after a valid code. They are then kept on the phone so the app works offline.</p>'+
  '<p><b>Naming</b>: plants found outside the original plan are numbered N plus a number, for example N27. If one replaced an existing position, use that position number with an N, for example N5.</p>'+
  '<p><b>Sections</b>: tap a heading with an arrow (⌄) on the plant page or More to close or open it, the same as the groups in the lists. The app remembers your choice on this device.</p>'+
  '<p><b>Excel</b>: “Download Excel” saves Plants, Plan and Log as separate sheets.</p>'+
  '</details>',true,'help')+
  '</div>';
}
function wireMore(){
  wireFolds(document);
  $$('[data-exp]').forEach(function(b){b.onclick=function(){exportFile(b.dataset.exp)}});
  $('#openTypes').onclick=openTypes;
  $('#openPlaces').onclick=openPlaces;
  var sn2=$('#setName');if(sn2)sn2.onclick=function(){var n=window.prompt('Your name',EDITOR||'');if(n!==null&&n.trim()){setEditor(n);renderAll()}};
  var ue=$('#unlockEdit');if(ue)ue.onclick=function(){db.unlock().then(renderAll)};
  var xb=$('#expXlsx');if(xb)xb.onclick=function(){exportXlsx(xb)};
}

/* ---------- render ---------- */
function renderAll(){
  applyRole();drawTabs();
  var app=$('#app');
  if(S.tab==='plants'){app.innerHTML=viewPlants();wirePlants()}
  else if(S.tab==='plan'){app.innerHTML=viewPlan();wirePlan()}
  else if(S.tab==='log'){app.innerHTML=viewLog();wireLog()}
  else{app.innerHTML=viewMore();wireMore()}
  refreshSheet();
}

/* ---------- boot ---------- */
buildPlants();renderAll();
(async function(){
  try{
    if(window.claude&&window.claude.use){
      db=await window.claude.use('db');
      downloads=await window.claude.use('downloads');
    }else if(HPL_API_URL){db=sheetDb(HPL_API_URL);downloads=fileDownloads()}
    else downloads=fileDownloads();
  }catch(e){db=null}
  if(db){
    S.useDb=true;
    sub('plantEdits');sub('tasks');sub('logs');sub('settings');
  }else{
    S.edits=loadLocal('edits');S.tasks=loadLocal('tasks');S.logs=loadLocal('logs');S.settings=loadLocal('settings');
    S.loaded={edits:true,tasks:true,logs:true,settings:true};buildPlants();
  }
  renderAll();
})();
})();
</script>
</body></html>
